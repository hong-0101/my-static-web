<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>🧧 领取优惠券</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fb;
            color: #1e293b;
            min-height: 100vh;
            position: relative;
        }

        /* ===== 优惠券弹窗样式 ===== */
        .coupon-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            animation: fadeIn 0.4s ease;
        }

        .coupon-overlay.hidden {
            display: none;
            animation: none;
        }

        .coupon-card {
            background: #fff;
            max-width: 380px;
            width: 100%;
            border-radius: 28px;
            padding: 0 0 24px 0;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
            position: relative;
        }

        .coupon-header {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            padding: 32px 24px 28px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .coupon-header::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 160px;
            height: 160px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }

        .coupon-header::after {
            content: '';
            position: absolute;
            bottom: -40px;
            left: -40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
        }

        .coupon-header .coupon-icon {
            font-size: 44px;
            margin-bottom: 8px;
            display: block;
            position: relative;
            z-index: 1;
        }

        .coupon-header .coupon-title {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        .coupon-header .coupon-amount {
            font-size: 58px;
            font-weight: 800;
            color: #fff;
            line-height: 1.1;
            margin-top: 4px;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
        }

        .coupon-header .coupon-amount small {
            font-size: 26px;
            font-weight: 600;
        }

        .coupon-header .coupon-sub {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 2px;
            position: relative;
            z-index: 1;
        }

        .coupon-body {
            padding: 20px 24px 0;
            text-align: center;
        }

        .coupon-body .coupon-expiry {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 18px;
        }

        .coupon-body .coupon-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 24px rgba(225, 29, 72, 0.35);
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        .coupon-body .coupon-btn:active {
            transform: scale(0.96);
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
        }

        .coupon-body .coupon-btn:disabled {
            opacity: 0.7;
            transform: scale(0.98);
            cursor: not-allowed;
        }

        .coupon-body .coupon-btn .btn-text {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .coupon-body .coupon-btn .btn-text i {
            font-size: 18px;
        }

        .coupon-body .coupon-btn.success {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 8px 24px rgba(22, 163, 74, 0.35);
        }

        .coupon-body .coupon-tip {
            font-size: 11px;
            color: #cbd5e1;
            margin-top: 14px;
            padding-bottom: 4px;
        }

        .coupon-divider {
            height: 2px;
            background: repeating-linear-gradient(90deg, #e2e8f0 0px, #e2e8f0 8px, transparent 8px, transparent 14px);
            margin: 16px 24px 0;
        }

        .coupon-close {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 22px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            background: none;
            border: none;
            z-index: 10;
            padding: 4px 8px;
        }

        .coupon-close:active {
            color: #fff;
            transform: scale(0.9);
        }

        .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: confettiDrop 1.2s ease-in forwards;
        }

        .confetti:nth-child(1) {
            left: 10%;
            background: #fbbf24;
            animation-delay: 0.1s;
        }
        .confetti:nth-child(2) {
            left: 30%;
            background: #f472b6;
            animation-delay: 0.3s;
        }
        .confetti:nth-child(3) {
            left: 50%;
            background: #60a5fa;
            animation-delay: 0.5s;
        }
        .confetti:nth-child(4) {
            left: 70%;
            background: #34d399;
            animation-delay: 0.2s;
        }
        .confetti:nth-child(5) {
            left: 90%;
            background: #fbbf24;
            animation-delay: 0.4s;
        }
        .confetti:nth-child(6) {
            left: 20%;
            background: #f472b6;
            animation-delay: 0.6s;
        }
        .confetti:nth-child(7) {
            left: 60%;
            background: #60a5fa;
            animation-delay: 0.15s;
        }
        .confetti:nth-child(8) {
            left: 80%;
            background: #34d399;
            animation-delay: 0.45s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes confettiDrop {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(60px) rotate(720deg);
                opacity: 0;
            }
        }

        /* ===== 个人中心样式 (全屏内容) ===== */
        .profile-page {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            background: #f5f7fb;
        }

        .profile-page.active {
            display: flex;
        }

        .profile-header {
            background: linear-gradient(135deg, #1e3a5f, #2a5f8f);
            color: #fff;
            padding: 18px 20px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .profile-header .title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .profile-header .right-placeholder {
            width: 30px;
        }

        /* 会员卡区域 */
        .profile-card {
            background: linear-gradient(135deg, #f97316, #f59e0b);
            margin: 20px 16px 16px;
            border-radius: 20px;
            padding: 20px 18px 18px;
            color: #fff;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
            position: relative;
            overflow: hidden;
        }

        .profile-card::after {
            content: '';
            position: absolute;
            top: -40px;
            right: -40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }

        .profile-card .card-top {
            display: flex;
            align-items: center;
        }

        .profile-card .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-card .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .profile-card .user-id {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* 积分 & 优惠券 */
        .profile-stats {
            display: flex;
            margin: 0 16px 16px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
        }

        .profile-stats .stat-item {
            flex: 1;
            text-align: center;
            padding: 16px 8px;
            border-right: 1px solid #f1f4f9;
            cursor: pointer;
            transition: background 0.2s;
        }

        .profile-stats .stat-item:last-child {
            border-right: none;
        }

        .profile-stats .stat-item:active {
            background: #f1f4f9;
        }

        .profile-stats .stat-item .num {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
        }

        .profile-stats .stat-item .label {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }

        /* 订单分类 */
        .profile-orders {
            margin: 0 16px 16px;
            background: #fff;
            border-radius: 16px;
            padding: 16px 0 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
        }

        .profile-orders .orders-title {
            padding: 0 18px 10px;
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            border-bottom: 1px solid #f1f4f9;
        }

        .profile-orders .orders-tabs {
            display: flex;
            justify-content: space-around;
            padding: 12px 8px 8px;
        }

        .profile-orders .orders-tabs .tab {
            text-align: center;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: background 0.2s;
            flex: 1;
        }

        .profile-orders .orders-tabs .tab:active {
            background: #f1f4f9;
        }

        .profile-orders .orders-tabs .tab .tab-icon {
            font-size: 24px;
            color: #64748b;
            display: block;
            margin-bottom: 2px;
        }

        .profile-orders .orders-tabs .tab .tab-label {
            font-size: 12px;
            color: #64748b;
        }

        .profile-orders .orders-tabs .tab .tab-badge {
            display: inline-block;
            background: #ef4444;
            color: #fff;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 30px;
            margin-left: 4px;
            font-weight: 600;
        }

        /* ===== 优惠券详情弹窗 ===== */
        .coupon-detail-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 24px;
            animation: fadeIn 0.25s ease;
        }

        .coupon-detail-modal.active {
            display: flex;
        }

        .coupon-detail-box {
            background: #fff;
            border-radius: 28px;
            max-width: 360px;
            width: 100%;
            padding: 32px 24px 24px;
            text-align: center;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease;
            position: relative;
        }

        .coupon-detail-box .close-detail-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 24px;
            color: #94a3b8;
            cursor: pointer;
            background: none;
            border: none;
        }

        .coupon-detail-box .close-detail-btn:active {
            color: #1e293b;
        }

        .coupon-detail-box .detail-icon {
            font-size: 56px;
            margin-bottom: 6px;
        }

        .coupon-detail-box .detail-amount {
            font-size: 42px;
            font-weight: 800;
            color: #e11d48;
            line-height: 1.2;
        }

        .coupon-detail-box .detail-amount small {
            font-size: 24px;
            font-weight: 600;
        }

        .coupon-detail-box .detail-title {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin: 4px 0 6px;
        }

        .coupon-detail-box .detail-expiry {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 20px;
        }

        .coupon-detail-box .detail-btn {
            background: linear-gradient(135deg, #2a5f8f, #1e3a5f);
            color: #fff;
            border: none;
            padding: 12px 40px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s;
            box-shadow: 0 4px 12px rgba(42, 95, 143, 0.3);
        }

        .coupon-detail-box .detail-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- ===== 优惠券弹窗 ===== -->
    <div class="coupon-overlay" id="couponOverlay">
        <div class="coupon-card">
            <button class="coupon-close" id="couponCloseBtn" aria-label="关闭">
                <i class="fas fa-times"></i>
            </button>
            <div class="coupon-header">
                <div class="confetti-container">
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                </div>
                <span class="coupon-icon">🧧</span>
                <div class="coupon-title">🎊 恭喜获得</div>
                <div class="coupon-amount">
                    <small>¥</small>150
                </div>
                <div class="coupon-sub">酒店预订优惠券</div>
            </div>
            <div class="coupon-body">
                <div class="coupon-expiry">⏰ 有效期至 2026-09-30</div>
                <button class="coupon-btn" id="couponClaimBtn">
                    <span class="btn-text">
                        <i class="fas fa-gift"></i> 立即领取
                    </span>
                </button>
                <div class="coupon-tip">点击领取即表示同意使用条款</div>
            </div>
            <div class="coupon-divider"></div>
        </div>
    </div>

    <!-- ===== 个人中心页面 (全屏内容) ===== -->
    <div class="profile-page" id="profilePage">
        <!-- 顶部导航 -->
        <div class="profile-header">
            <span class="title">个人中心</span>
            <span class="right-placeholder"></span>
        </div>

        <!-- 会员卡区域 -->
        <div class="profile-card">
            <div class="card-top">
                <div class="user-info">
                    <div class="avatar">ID</div>
                    <div>
                        <div class="user-id">103174889</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 积分 & 优惠券 -->
        <div class="profile-stats">
            <div class="stat-item">
                <div class="num">0</div>
                <div class="label">积分</div>
            </div>
            <div class="stat-item" id="couponStatItem">
                <div class="num">1</div>
                <div class="label">优惠券</div>
            </div>
        </div>

        <!-- 订单分类 -->
        <div class="profile-orders">
            <div class="orders-title">全部订单</div>
            <div class="orders-tabs">
                <div class="tab">
                    <span class="tab-icon">🕒</span>
                    <span class="tab-label">待支付</span>
                    <span class="tab-badge">0</span>
                </div>
                <div class="tab">
                    <span class="tab-icon">✅</span>
                    <span class="tab-label">待确认</span>
                    <span class="tab-badge">0</span>
                </div>
                <div class="tab">
                    <span class="tab-icon">📋</span>
                    <span class="tab-label">待使用</span>
                    <span class="tab-badge">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 优惠券详情弹窗 (点击优惠券) ===== -->
    <div class="coupon-detail-modal" id="couponDetailModal">
        <div class="coupon-detail-box">
            <button class="close-detail-btn" id="closeDetailBtn"><i class="fas fa-times"></i></button>
            <div class="detail-icon">🧧</div>
            <div class="detail-amount"><small>¥</small>150</div>
            <div class="detail-title">酒店预订优惠券</div>
            <div class="detail-expiry">⏰ 有效期至 2026-09-30</div>
            <button class="detail-btn" id="detailOkBtn">知道了</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  优惠券弹窗逻辑
        // ============================================================
        (function() {
            var overlay = document.getElementById('couponOverlay');
            var claimBtn = document.getElementById('couponClaimBtn');
            var closeBtn = document.getElementById('couponCloseBtn');
            var profilePage = document.getElementById('profilePage');
            var isClaimed = false;

            function showProfile() {
                overlay.classList.add('hidden');
                profilePage.classList.add('active');
            }

            claimBtn.addEventListener('click', function() {
                if (isClaimed) return;
                isClaimed = true;
                var btnText = claimBtn.querySelector('.btn-text');
                claimBtn.disabled = true;
                claimBtn.classList.add('success');
                btnText.innerHTML = '<i class="fas fa-check-circle"></i> 领取成功！';

                // 延迟显示个人中心
                setTimeout(function() {
                    showProfile();
                }, 600);
            });

            closeBtn.addEventListener('click', function() {
                if (!isClaimed) {
                    // 未领取点击关闭，提示
                    alert('💡 先领取优惠券再进入个人中心吧~');
                    return;
                }
                showProfile();
            });

            console.log('🎫 优惠券弹窗已加载');
        })();

        // ============================================================
        //  个人中心交互（优惠券详情）
        // ============================================================
        (function() {
            var couponStatItem = document.getElementById('couponStatItem');
            var couponDetailModal = document.getElementById('couponDetailModal');
            var closeDetailBtn = document.getElementById('closeDetailBtn');
            var detailOkBtn = document.getElementById('detailOkBtn');

            function openCouponDetail() {
                couponDetailModal.classList.add('active');
            }

            function closeCouponDetail() {
                couponDetailModal.classList.remove('active');
            }

            couponStatItem.addEventListener('click', openCouponDetail);
            closeDetailBtn.addEventListener('click', closeCouponDetail);
            detailOkBtn.addEventListener('click', closeCouponDetail);
            couponDetailModal.addEventListener('click', function(e) {
                if (e.target === couponDetailModal) {
                    closeCouponDetail();
                }
            });

            // 订单标签点击提示
            var tabs = document.querySelectorAll('.profile-orders .tab');
            tabs.forEach(function(tab) {
                tab.addEventListener('click', function() {
                    var label = this.querySelector('.tab-label').textContent;
                    alert('查看「' + label + '」订单列表');
                });
            });

            console.log('👤 个人中心已加载');
        })();
    </script>
</body>
</html>
